<svg width="400" height="200" viewBox="0 0 400 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background transparan untuk menyesuaikan halaman login -->
  
  <!-- Text "cadisdik XI" -->
  <text x="40" y="60" font-family="Arial, sans-serif" font-size="24" font-weight="600" fill="#10B981">cadisdik XI</text>
  
  <!-- Text "disdik" -->
  <text x="40" y="110" font-family="Arial, sans-serif" font-size="48" font-weight="700" fill="#1E40AF">disdik</text>
  
  <!-- Text "jabar" -->
  <text x="40" y="160" font-family="Arial, sans-serif" font-size="48" font-weight="700" fill="#1E40AF">jabar</text>
  
  <!-- Logo Symbol - 4 bagian geometris -->
  <g transform="translate(280, 40)">
    <!-- Bagian hijau (kanan atas) -->
    <path d="M30 0 L80 0 L80 30 L60 50 L30 50 Z" fill="#10B981"/>
    
    <!-- Bagian kuning (kiri atas) -->
    <path d="M0 0 L30 0 L30 50 L0 30 Z" fill="#F59E0B"/>
    
    <!-- Bagian biru tua (kanan bawah) -->
    <path d="M60 50 L80 30 L80 80 L30 80 Z" fill="#1E40AF"/>
    
    <!-- Bagian biru muda (kiri bawah) -->
    <path d="M0 30 L30 50 L30 80 L0 80 Z" fill="#60A5FA"/>
  </g>
</svg>